<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <div id="forms-Data" class="fixed hidden top-0 left-0 w-screen h-screen flex items-center justify-center">
    <form id="form" class="w-auto flex flex-col gap-5 bg-gray-50 h-auto p-4 border border-gray-500 shadow-xl rounded-md">
        <div class="flex items-center gap-2">
            <label for="title">Title:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="title" placeholder=" title">
        </div>
        <div class="flex items-center gap-2">
            <label for="description">Description:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="description" placeholder=" description">
        </div>
        <div class="flex items-center gap-2">
            <label for="price">Price:</label>
            <input class="w-full border p-1 rounded-md" type="number" id="price" placeholder=" price">
        </div>
        <div class="flex items-center gap-2">
            <label for="category">Category:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="category" placeholder=" category">
        </div>
        <div class="flex items-center gap-2">
            <label for="image">Image:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="image" placeholder=" image">
        </div >
        <div class="flex justify-center items-center gap-2">
             <button class="bg-blue-500 px-4 py-2 border-none rounded-md cursor-pointer" id="cancel" type="button">Cancel</button>
        <button class="bg-green-500 px-4 py-2 border-none rounded-md cursor-pointer" type="submit">Submit</button>
        </div>
    </form>
    </div>
    
            <div class="pt-20">
                <div class="flex px-7 items-center gap-2 justify-between">
                    <h1 class="m-auto flex-1 w-[300px] text-center  mb-10 text-5xl">Product Table</h1>
                    <input class="border p-2 rounded-md" type="seacrh" id="search" placeholder="search product by name" />
                    <button id="showAdd" class="bg-blue-500 px-4 py-2 border-none rounded-md cursor-pointer">Add Product</button>
                       </div>
                    <table class="w-full border">
        <thead>
            <tr class="border">
                <th class="border-r w-20">ID</th>
                <th class="border-r">Name</th>
                <th class="border-r">Description</th>
                <th class="border-r">Price</th>
                <th class="border-r">Category</th>
                <th class="border-r">Image</th>
                <th class="border-r">Action</th>
            </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
    </table>
    </div>
</body>

<script>
    let products = [];
    const tbody = document.getElementById("tbody");
    const title = document.getElementById("title");
    const description = document.getElementById("description");
    const price = document.getElementById("price");
    const category = document.getElementById("category");
    const image = document.getElementById("image");
      const form = document.getElementById("form");
    const modal = document.getElementById("forms-Data");
    const showAdd = document.getElementById("showAdd");
    const cancel = document.getElementById("cancel");
    let editing = null;
    const search = document.getElementById("search");
    function renderProducts(){
        let filteredProducts = products.filter((product)=>product.title.toLowerCase().includes(search.value.toLowerCase()));
        filteredProducts.sort((a ,b)=> b.id - a.id);
        tbody.innerHTML= "";
        filteredProducts.forEach((product)=>{
            tbody.innerHTML += `<tr class="border text-center">
                <td class="border-r">${product.id}</td>
                <td class="border-r max-w-[150px] truncate">${product.title}</td>
                <td class="border-r max-w-[250px] truncate">${product.description}</td>
                <td class="border-r">${product.price}</td>
                <td class="border-r">${product.category}</td>
                <td class="border-r"><img class="w-20 m-auto h-20" src=${product.image} /> </td>
                <td>
                <button class="bg-gray-500 px-4 py-1 border-none rounded-md cursor-pointer" onclick="viewProduct(${product.id})">View</button>
                <button class="bg-blue-500 px-4 py-1 border-none rounded-md cursor-pointer" onclick="editProduct(${product.id})">Edit</button>
                <button class="bg-red-500 px-4 py-1 border-none rounded-md cursor-pointer" onclick="deleteProduct(${product.id})">Delete</button>
                </td>
                 </tr>
                `
        })
    }

       function getData(){
             return {
                title : title.value,
                description : description.value,
                price : price.value,
                category : category.value,
                image : image.value
             }
       }

       async function getProdcuts(){

        const res = await fetch("https://fakestoreapi.com/products");
        const data = await res.json();
        products = data;
        renderProducts();
       }
       search.addEventListener("input", renderProducts);
              

       showAdd.addEventListener("click", function(){
        modal.classList.remove("hidden");
       })
       cancel.addEventListener("click", function(){
        modal.classList.add("hidden");
       })

       async function addProduct(product){
        const res = await fetch("https://fakestoreapi.com/products", {
            method : "POST",
            headers : {
                "Content-Type" : "application/json",
            },
            body : JSON.stringify(product)
        })
        const data = await res.json();
        products.push(data);
        renderProducts();
        modal.classList.add("hidden");
       }

       function viewProduct(id){
        const product = products.find((product) => product.id === id);
        sessionStorage.setItem("viewProduct", JSON.stringify(product));
        window.location.href = "ProductView.html";
       }

       function editProduct(id){
        const product = products.find((product) => product.id === id);
        title.value = product.title;
        description.value = product.description;
        price.value = product.price;
        category.value = product.category;
        image.value = product.image;
        editing = id;
        modal.classList.remove("hidden");
       }

       async function updateProduct(){
        const product = getData();
        const res = await fetch(`https://fakestoreapi.com/products/${editing}`, {
            method : "PUT",
            headers : {
                "Content-Type" : "application/json",
            },
            body : JSON.stringify(product)
        })
        const data = await res.json();
        const index = products.findIndex((product) => product.id === editing);
        products[index] = data;
        renderProducts();
        modal.classList.add("hidden");
        editing = null;
       }

       async function deleteProduct(id){
        const res = await fetch(`https://fakestoreapi.com/products/${id}`, {
            method : "DELETE",
        })
        products = products.filter((product) => product.id !== id);
        renderProducts();
       }

       form.addEventListener("submit", (e)=>{
        e.preventDefault();
        if(editing){
            updateProduct(editing);
        }
        else{
            addProduct(getData());
        }
       })
       
       getProdcuts()
</script>
</html>
