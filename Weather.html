<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
     

    <div class="flex items-center h-screen justify-center">
        <div class="flex rounded-md p-5 flex-col items-center justify-center bg-black text-white gap-2">
           
          <div class="flex items-center gap-4 justify-between">
            <input class="border py-1.5 rounded-md px-2 border-white " type="text" id="city" placeholder="Enter City Name">
            <button class="bg-blue-500 px-4 py-2 border-none rounded-md cursor-pointer" id="search" type="button">Search</button>
          </div>
            <h1 id="cityTitle"></h1>
            <h2 id="country"></h2>
            <p id="temp"></p>
            <img id="icon" src="" alt="">
            <p id="desc"></p>
            <p id="wind"></p>
          
            <p id="humidity"></p>
            

        </div>

    </div>
</body>

    <script>
        const apiKEy = "09f6fee72c8cc92479ed8d842efcac23";
        const city = document.getElementById("city");
         const search = document.getElementById("search");
         const cityTitle = document.getElementById("cityTitle");
         const country = document.getElementById("country");
         const temp = document.getElementById("temp");
         const icon = document.getElementById("icon");
         const desc = document.getElementById("desc");
         const wind = document.getElementById("wind");
       
         const humidity = document.getElementById("humidity");


         async function GetWeather(){
            
            try{
                if(city.value === "") return;
             const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city.value}&appid=${apiKEy}`);
             const data = await response.json();
              console.log(data);
            cityTitle.innerHTML = `City: ${data.name}`;
            country.innerHTML = `Country: ${data.sys.country}`;
            temp.innerHTML = `Temperature: ${Math.round(data.main.temp - 273.15)}°C`; // data.main.temp - 273.15;
            icon.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}.png`;
            desc.innerHTML = `Weather: ${data.weather[0].description} `;
            wind.innerHTML = `Wind: ${data.wind.speed} m/ph`;
           
            humidity.innerHTML =`Humidity: ${data.main.humidity} %`
            }
            catch(error){
                console.log(error);
            }
         }

         search.addEventListener('click', GetWeather);
       
    </script>
</html>
