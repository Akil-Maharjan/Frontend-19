<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="My Portfolio">
    <meta property="og:description" content="This is my portfolio website.">
    <meta property="og:image" content="https://i.ibb.co/6JDYy3vy/slide1.avif">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <div id="forms-Data" class="fixed hidden top-0 left-0 w-screen h-screen flex items-center justify-center">
    <form id="form" class="w-auto flex flex-col gap-5 bg-gray-50 h-auto p-4 border border-gray-500 shadow-xl rounded-md">
        <div class="flex items-center gap-2">
            <label for="title">Title:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="title" placeholder=" title">
        </div>
        <div class="flex items-center gap-2">
            <label for="description">Description:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="description" placeholder=" description">
        </div>
        <div class="flex items-center gap-2">
            <label for="price">Price:</label>
            <input class="w-full border p-1 rounded-md" type="number" id="price" placeholder=" price">
        </div>
        <div class="flex items-center gap-2">
            <label for="category">Category:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="category" placeholder=" category">
        </div>
        <div class="flex items-center gap-2">
            <label for="image">Image:</label>
            <input class="w-full border p-1 rounded-md" type="text" id="image" placeholder=" image">
        </div >
        <div class="flex justify-center items-center gap-2">
             <button class="bg-blue-500 px-4 py-2 border-none rounded-md cursor-pointer" id="cancel" type="button">Cancel</button>
        <button class="bg-green-500 px-4 py-2 border-none rounded-md cursor-pointer" type="submit">Submit</button>
        </div>
    </form>
    </div>
    
            <div class="pt-20">
                <div class="flex px-7 items-center gap-2 justify-between">
                    <h1 class="m-auto flex-1 w-[300px] text-center  mb-10 text-5xl">Product Table</h1>
                    <input class="border p-2 rounded-md" type="seacrh" id="search" placeholder="search product by name" />
                    <button id="showAdd" class="bg-blue-500 px-4 py-2 border-none rounded-md cursor-pointer">Add Product</button>
                       </div>
                    <table class="w-full border">
        <thead>
            <tr class="border">
                <th class="border-r w-20">ID</th>
                <th class="border-r">Name</th>
                <th class="border-r">Description</th>
                <th class="border-r">Price</th>
                <th class="border-r">Category</th>
                <th class="border-r">Image</th>
                <th class="border-r">Action</th>
            </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
    </table>
    </div>
</body>

<script src="product.js">
</script>
</html>
