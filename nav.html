<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
  margin: 0px;
  padding: 0px;
  box-sizing: border-box;
  font-family: cursive;
}
html{
  scroll-behavior: smooth;
}
.header{
    width: 100%;
    background-color: white;
    display: flex;
    gap:50px;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
}

.logo {
  display: flex;
  align-items: center;
  gap: 5px;
  flex: 1;
}
.logo img {
  height: 100px;
}
.hamburger {
  display: none;
  font-size: 30px;
  background-color: transparent;
  border: none;
  cursor: pointer;
}


.nav-list {
  display: flex;
  align-items: center;
  gap: 30px;
  position: relative;
}
.nav-list li {
  list-style: none;
  cursor: pointer;
  border-radius: 5px;
  color: white;
  position: relative;
}
.nav-list li:before {
  content: "";
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 0px;
  height: 2px;
  background-color: black;
  transition: all 0.3s ease-in-out;
}
.nav-list li:hover:before {
  width: 100%;
}

.nav-list a {
  text-decoration: none;
  color: black;
  font-size: 20px;
}

.buttons {
  display: flex;
  align-items: center;
  gap: 10px;
}
.button {
  padding: 10px 20px;
  border-radius: 5px;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease-in-out;
  font-size: 18px;
  &:hover {
    background-color: black;
  color: white;
  }
}
@media (max-width: 768px) {
    .hamburger{
        display: block;
    }
    .nav-list{
        display: none;
    }
    .buttons{
        display: none;
    }
    .showNav{
        display: block;
        position: absolute;
        top: 0px;
        left: 0;
        height: 100vh;
        background-color: red;
        width: 50%;
        transition: all 0.3s ease-in-out;
    }
}
</style>
<body>
    <main>
         <header class="header">
       
        <div class="logo">
          <img src="images/Portfolio.png" alt="portfolio image" />
        </div>
        <button id="hamburger" class="hamburger"> &#9776;</button>
        <nav class="nav ">
          <ul class="nav-list">
            <li><a class="rounded-[8px] bg-black text-white px-[10px] hover:bg-blue-500 py-[5px]" href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </nav>
        <div class="buttons">
          <button onclick="alert('Login successful!')" class="login button">Login</button>
          <button class="download button">Downlaod CV</button>
        </div>
      </header>
    </main>
</body>
<script>
    const  hamburger = document.getElementById('hamburger');
    const nav = document.querySelector('.nav-list');
    hamburger.addEventListener('click', () => {
      nav.classList.toggle('showNav');
    });
</script>
</html>
