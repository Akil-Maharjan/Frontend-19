<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        height: 200vh;
    }
     .parent{
        width: 500px;
        height: 500px;
        border: 2px solid black;
        position: relative;    
     }
     .child1{
        width: 100px;
        height: 100px;
        border: 2px solid red;
        background-color: red;
        position: absolute;
        top: 0px;
        left: 0px;
        z-index: 1;
     }
     .child2{
        width: 100px;
        height: 100px;
        border: 2px solid green;
        background-color: green;
        position: absolute;
        top: 40px;
        left: 40px;
     }
     .child3{
        width: 100vw;
        height: 100px;
        border: 2px solid blue;
        background-color: blue;
        position: fixed;
        top: 0;
        left: 0;
      
        z-index: 2;
     }
     .child4{
        width: 100px;
        height: 100px;
        border: 2px solid yellow;
        position: absolute;
        bottom: 0;
        right: 0;
     }
</style>
<body>
    <div class="parent">
        <div class="child1">1</div>
        <div class="child2">2</div>
        <div class="child3">Sticky</div>
        <div class="child4">4</div>

    </div>
</body>
</html>
