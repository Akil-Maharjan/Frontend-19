<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    :root{
      --bg-primary: blue;
    }
     nav{
        background-color: var(--bg-primary);
        padding: 10px 20px;
        color: white;
        height: auto;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: fixed;

     }
     
     ul{
        display: flex;
        align-items: center;
        list-style: none;
        gap: 50px;
        justify-content: center;
        flex: 1;
        
     }
     #nav-list{
        display: none;
     }
    
     li{
        position: relative;
     }
     li a{
        text-decoration: none;
        color: white;
     }
     li a:before{
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0%;
        height: 2px;
        background-color: white;
        transition: width 0.3s ease-in-out;
     }
     li a:hover:before{
        width: 100%;
     }
     .hamburger{
        display: none;
        font-size: 32px;
        cursor: pointer;
     }

     @media screen and (max-width: 768px) {
        .hamburger{
          display: block;
        }
       
        ul{
          position: absolute;
          top: 60px;
          left: 0;
          flex-direction: column;
          align-items: flex-start;
          padding: 10px 20px;
          background-color: var(--bg-primary);
          width: 100%;
          transform: translateX(-100%);
          overflow: hidden;
          opacity: 0;
          transition: all 0.3s ease-in-out;
        }
        #nav-list:checked ~ ul{
           opacity: 1;
           transform: translateX(0);
        }
       
     }
    
</style>
<body>
     <nav>
        <h1>Logo</h1>
        <input type="checkbox" id="nav-list">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About </a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Skills</a></li>
            <li><a href="#">Contacts</a></li>
        </ul>
         
      <label for="nav-list" class="hamburger">
         &#9776;   
      </label>
     </nav>

</body>
</html>
