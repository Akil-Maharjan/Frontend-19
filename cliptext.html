<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clip Text Inside Background</title>
    <style>
      /* ============================================================
         "Clip text inside background"
         The background image is painted ONLY inside the actual
         letter shapes (glyphs) of the text. The rest of the element
         stays transparent so whatever sits behind it shows through.

         The three key lines are:
           1. background: url(...)  -> the image you want inside text
           2. background-clip: text -> crop image to the text shape
           3. text-fill-color: transparent -> hide the normal text
              color so the image is visible instead
         ============================================================ */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        /* A base color behind, so the transparent parts are still visible */
        background-color: #0d0f1a;
        font-family: "Poppins", "Segoe UI", Arial, sans-serif;
        padding: 2rem;
      }

      .clipped-text {
        /* The image that fills the letters */
        background: url("https://images.unsplash.com/photo-1575550959106-5a7defe28b56?w=1500&auto=format&fit=crop&q=80")
          center / cover no-repeat;

        /* Crop the background down to the text glyphs */
        -webkit-background-clip: text;
        background-clip: text;

        /* Make the normal text colour invisible so the image shows */
        -webkit-text-fill-color: transparent;
        color: transparent; /* fallback for browsers without text-fill-color */

        font-size: clamp(2.5rem, 10vw, 8rem);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        line-height: 1.1;
        text-align: center;
        max-width: 95vw;
      }

      /* A smaller secondary example using a gradient instead of an image */
      .clipped-gradient {
        margin-top: 2rem;
        font-size: clamp(1.5rem, 6vw, 4rem);
        font-weight: 800;
        text-transform: uppercase;
        background: linear-gradient(90deg, #f59e0b, #ef4444, #8b5cf6);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div>
      <h1 class="clipped-text">Africa Wildlife</h1>
      <p class="clipped-gradient">Gradient text too</p>
    </div>
  </body>
</html>
